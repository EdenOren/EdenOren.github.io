name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pre-renders every board region and /classic into <route>/index.html (see app.routes.server.ts).
      - name: Build Angular app
        run: npx ng build --configuration production

      # GitHub Pages only returns 200 for files that exist. The router redirects / to /hero, which
      # pre-rendering writes as a bare meta-refresh page with no link-preview tags, so / serves the
      # pre-rendered hero instead. Admin routes are client-rendered and get the CSR shell.
      # Anything else falls back to 404.html and the in-app 404 page.
      # Keep the admin list in sync with AdminRoute.
      - name: Place root, admin and 404 pages
        run: |
          cd dist/portfolio/browser
          cp hero/index.html index.html
          cp index.csr.html 404.html
          for route in admin admin/about admin/experience admin/projects admin/skills; do
            mkdir -p "$route"
            cp index.csr.html "$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/portfolio/browser'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
